title = "vtspeak Gitleaks configuration"

[extend]
useDefault = true

[[allowlists]]
description = "Generated CAPA reports list imported API names that trigger generic-api-key false positives."
paths = [
  '''(?:^|/)tools/revkit/work/reports/vt_(?:jam|jul|kat|pau)\.capa\.json$''',
  '''(?:^|/)tools/revkit/work/corpus-parity/full-analysis-2006/capa\.json$''',
]
targetRules = ["generic-api-key"]

[[allowlists]]
description = "Reproduction inventories map file paths to SHA-256 checksums."
condition = "AND"
paths = [
  '''(?:^|/)tools/revkit/work/trace-reproduction/(?:kate-installer-files|wav-runtime-inputs)\.json$''',
]
targetRules = ["generic-api-key"]
regexTarget = "line"
regexes = ['''^\s*"[^"\r\n]+": "[0-9a-f]{64}",?\s*$''']

[[allowlists]]
description = "Reimplementation engine false positives"
condition = "AND"
paths = [
  '''^engine/duration/paul2013\.go$''',
]
regexTarget = "line"
regexes = ['''// whole-token processing, EvaluatePaul2013NormalizerCharacterSequence''']
